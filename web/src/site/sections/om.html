  <section class="about" id="om">
    <div class="wrap">
      <div class="equation" aria-label="Förskola och specialpedagogik plus inredning och homestaging plus lera och hantverk blir Studio Dalarud">
        <div class="peb peb--1"><canvas class="blob" data-color="--moss-soft" data-seed="11" data-alpha=".1" aria-hidden="true"></canvas>Förskola<small>och specialpedagogik</small></div>
        <span class="op" aria-hidden="true">+</span>
        <div class="peb peb--2"><canvas class="blob" data-color="--bg" data-seed="23" data-alpha=".12" aria-hidden="true"></canvas>Inredning<small>och homestaging</small></div>
        <span class="op" aria-hidden="true">+</span>
        <div class="peb peb--3"><canvas class="blob" data-color="--clay-soft" data-seed="37" data-alpha=".1" aria-hidden="true"></canvas>Lera<small>och hantverk</small></div>
        <span class="op op--eq" aria-hidden="true">=</span>
        <div class="peb peb--sum"><canvas class="blob" data-color="--fg" data-seed="5" data-alpha=".12" aria-hidden="true"></canvas><em style="font-style:italic">ro</em><small>Studio Dalarud</small></div>
      </div>
      <div class="about__grid">
        <figure class="portrait">
          {{portrait}}
        </figure>
        <div class="about__text">
          <p class="eyebrow">Om Sofia</p>
          <h2>{{t:om.title}}</h2>
          <p>{{t:om.p1}}</p>
          <p>{{t:om.p2}}</p>
          <p>{{t:om.p3}}</p>
          <p>{{t:om.p4}}</p>
          <p class="signature">Sofia</p>
        </div>
      </div>
    </div>
  </section>
