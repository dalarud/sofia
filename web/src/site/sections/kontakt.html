  <section class="contact" id="kontakt">
    <div class="wrap contact__grid">
      <div class="contact__info">
        <p class="eyebrow">Första steget</p>
        <h2>{{t:kontakt.title}}</h2>
        <p>{{t:kontakt.lede}}</p>
        <ul class="contact__list">
          <li><span>E-post</span><span>{{s:company.email}}</span></li>
          <li><span>Instagram</span><span>{{s:company.instagram}}</span></li>
          <li><span>Område</span><span>{{t:kontakt.area}}</span></li>
        </ul>
      </div>
      <form class="form" id="contactForm" novalidate>
        <fieldset>
          <legend>Välj det som stämmer, gärna flera</legend>
          <div class="chips" id="painChips">
            <button class="chip" type="button" aria-pressed="false">Det blir alltid rörigt</button>
            <button class="chip" type="button" aria-pressed="false">Morgnarna är stressiga</button>
            <button class="chip" type="button" aria-pressed="false">Svårt att varva ner</button>
            <button class="chip" type="button" aria-pressed="false">Barnrummet fungerar inte</button>
            <button class="chip" type="button" aria-pressed="false">Vi ska sälja</button>
            <button class="chip" type="button" aria-pressed="false">Vi ska flytta</button>
            <button class="chip" type="button" aria-pressed="false">Mamma eller pappa ska flytta</button>
            <button class="chip" type="button" aria-pressed="false">Det känns opersonligt</button>
          </div>
        </fieldset>
        <div class="field"><label for="f-name">Namn</label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-email">E-post</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field field--full"><label for="f-service">Jag är intresserad av</label>
          <select id="f-service" name="service">
            <option>Flytta med ro</option><option>Homestaging</option><option>Ett hem som ger ro</option><option>Verksamheter</option><option>Föreläsning</option><option>Kurs i lera</option><option>Lera / beställning</option>
          </select>
        </div>
        <div class="field field--full"><label for="f-msg">Berätta mer (frivilligt)</label><textarea id="f-msg" name="message" placeholder="Vilka rum gäller det, och hur vill du att hemmet ska kännas?"></textarea></div>
        <div class="form__foot">
          <small>Jag använder dina uppgifter bara för att svara dig. <a href="/integritet">Läs mer.</a></small>
          <button class="btn" type="submit">Skicka förfrågan</button>
        </div>
        <p class="form__done" id="formDone" hidden></p>
      </form>
    </div>
  </section>
