  <section class="deep" id="gemenskap" aria-labelledby="gem-h">
    <div class="wrap">
      <div class="head head--deep">
        <div><p class="eyebrow">Att höra till</p><h2 id="gem-h">{{t:liv.gemenskap.title}}</h2></div>
        <p>{{t:liv.gemenskap.lede}}</p>
      </div>
      <div class="club">{{rows:liv.gemenskap:club}}</div>
      <form class="news-inline" data-news-form novalidate id="sondagsbrevet">
        <label for="news-email">Prenumerera på Söndagsbrevet</label>
        <div class="news-inline__row"><input id="news-email" type="email" autocomplete="email" placeholder="Din e-post"><button class="btn btn--light" type="submit">Prenumerera</button></div>
        <p class="form__done" hidden></p>
      </form>
    </div>
  </section>
