  <section class="tjat-sec" id="tjatmataren" aria-labelledby="tjat-h">
    <div class="wrap tjat-sec__grid">
      <div>
        <p class="eyebrow">Tjatmätaren</p>
        <h2 id="tjat-h">{{t:barn.tjat.title}}</h2>
        <p class="tjat-sec__lede">{{t:barn.tjat.lede}}</p>
        <div class="tjat__result" id="tjatResult" aria-live="polite"></div>
      </div>
      <div class="tjat" data-tjat>
        <div class="chips tjat__days" role="group" aria-label="Vilken dag">
          <button class="chip" type="button" data-day="0" aria-pressed="true">Dag 1</button>
          <button class="chip" type="button" data-day="1" aria-pressed="false">Dag 2</button>
          <button class="chip" type="button" data-day="2" aria-pressed="false">Dag 3</button>
        </div>
        <div class="tjat__rows">
          <div class="tjat__row" data-cat="morgon"><div><b>Morgonen</b><small>kläder, skor, komma iväg</small></div><button type="button" class="tjat__btn" data-step="-1" aria-label="Ta bort ett tjat om morgonen">−</button><output class="tjat__n">0</output><button type="button" class="tjat__btn" data-step="1" aria-label="Lägg till ett tjat om morgonen">+</button></div>
          <div class="tjat__row" data-cat="lek"><div><b>Leken</b><small>plocka undan, var är …?</small></div><button type="button" class="tjat__btn" data-step="-1" aria-label="Ta bort ett tjat om leken">−</button><output class="tjat__n">0</output><button type="button" class="tjat__btn" data-step="1" aria-label="Lägg till ett tjat om leken">+</button></div>
          <div class="tjat__row" data-cat="over"><div><b>Övergångar</b><small>sluta med något, komma till bordet</small></div><button type="button" class="tjat__btn" data-step="-1" aria-label="Ta bort ett tjat om övergångar">−</button><output class="tjat__n">0</output><button type="button" class="tjat__btn" data-step="1" aria-label="Lägg till ett tjat om övergångar">+</button></div>
          <div class="tjat__row" data-cat="kvall"><div><b>Kvällen</b><small>tänder, skärm, läggning</small></div><button type="button" class="tjat__btn" data-step="-1" aria-label="Ta bort ett tjat om kvällen">−</button><output class="tjat__n">0</output><button type="button" class="tjat__btn" data-step="1" aria-label="Lägg till ett tjat om kvällen">+</button></div>
        </div>
        <p class="tjat__foot"><span id="tjatDayTotal">0 gånger i dag</span><button type="button" class="tjat__reset" id="tjatReset">Börja om</button></p>
      </div>
    </div>
  </section>
