  <section class="gift" id="presentkort">
    <div class="wrap gift__grid">
      <div class="gift__form">
        <div><p class="eyebrow">Presentkort</p><h2>{{t:present.title}}</h2></div>
        <p class="gift__lede">{{t:present.lede}}</p>
        <fieldset class="gift__set">
          <legend>Vad vill du ge?</legend>
          <div class="chips" id="giftTypes">
{{giftTypes}}
          </div>
        </fieldset>
        <div class="field" id="giftCustom" hidden><label for="gift-amount">Belopp (minst 200 kr)</label><input id="gift-amount" type="number" min="200" step="100" value="500" inputmode="numeric"></div>
        <div class="gift__two">
          <div class="field"><label for="gift-to">Till</label><input id="gift-to" placeholder="Mottagarens namn"></div>
          <div class="field"><label for="gift-from">Från</label><input id="gift-from" placeholder="Ditt namn"></div>
        </div>
        <div class="field"><label for="gift-msg">Hälsning</label><textarea id="gift-msg" maxlength="120" placeholder="Grattis! Nu får du äntligen ordning i hallen."></textarea></div>
        <div class="gift__foot"><span class="gift__sum" id="giftSum">2 495 kr</span><button class="btn" type="button" id="giftAdd">Lägg i korgen</button></div>
      </div>
      <div class="gift__preview" aria-label="Förhandsvisning av presentkortet">
        <div class="giftcard">

0.2 3.1 10 7.9-.2 4.9-4.6 7.9-10.2 7.9-5.4 0-9.6-2.6-9.9-7.3Z" fill="var(--accent)"/><path transform="matrix(1 0 0 1 348 94)" d="M36 -18A18 18 0 1 0 0 -18A18 18 0 1 0 36 -18M36 -56V0" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path transform="matrix(1 0 0 1 124 26)" d="M6.11 -8.56A3.1 2.5 0 1 0 3.3 -5A3.1 2.5 0 1 1 .49 -1.44" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path transform="matrix(1 0 0 1 138.1 26)" d="M0 -10H7M3.5 -10V0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path transform="matrix(1 0 0 1 152.6 26)" d="M0 -10V-3.5A3.5 3.5 0 0 0 7 -3.5V-10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path transform="matrix(1 0 0 1 167.1 26)" d="M0 0V-10H2A5 5 0 0 1 2 0Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path transform="matrix(1 0 0 1 181.6 26)" d="M0 -10V0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path transform="matrix(1 0 0 1 189.1 26)" d="M5 -10A5 5 0 1 0 5 0A5 5 0 1 0 5 -10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="giftcard__label">Presentkort</span></div>
          <div class="giftcard__mid"><span class="giftcard__what" id="gcWhat">Hembesök</span><span class="giftcard__sum" id="gcSum">2 495 kr</span></div>
          <div class="giftcard__bottom"><span class="giftcard__to" id="gcTo">Till dig</span><span class="giftcard__msg" id="gcMsg">Grattis! Nu får du äntligen ordning i hallen.</span></div>
        </div>
        <p class="gift__note">Så här ser kortet ut. Det skickas som PDF till dig, så att du kan skriva ut det eller skicka det vidare.</p>
      </div>
    </div>
  </section>
